<!DOCTYPE html>
<html>
<head>
    <title>Pan and Zoom Example</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #content {
            width: 8000px;
            height: 2000px;
            background-color: #f0f0f0;
            position: relative;
        }

        .element {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #3498db;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="content">
        <!-- Random elements -->
        <div class="element"></div>
        <div class="element"></div>
        <div class="element"></div>
        <div class="element"></div>
        <div class="element"></div>
    </div>

    <script>
const contentElement = document.getElementById('content');
let offsetX = 0;
let offsetY = 0;
let speed = 50;

    // Atualiza as posições dos elementos
    const elements = document.querySelectorAll('.element');
    elements.forEach(element => {
        element.style.left = `${Math.floor(Math.random() * 8000)}px`;
        element.style.top = `${Math.floor(Math.random() * 2000)}px`;
    });

window.addEventListener('keydown', (event) => {
    switch (event.key) {
        case 'w':
            offsetY += speed;
            break;
        case 'a':
            offsetX += speed;
            break;
        case 's':
            offsetY -= speed;
            break;
        case 'd':
            offsetX -= speed;
            break;
    }

    contentElement.style.transform = `translate(${offsetX}px, ${offsetY}px)`;


});

    </script>
</body>
</html>
