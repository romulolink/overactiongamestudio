<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sand Castle Idle</title>
    <link rel="stylesheet" href="./css/style.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/progressbar.js/0.6.1/progressbar.min.js"
      integrity="sha512-7IoDEsIJGxz/gNyJY/0LRtS45wDSvPFXGPuC7Fo4YueWMNOmWKMAllEqo2Im3pgOjeEwsOoieyliRgdkZnY0ow=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <div class="Sky">
      <!-- Sky div starts -->

      <div class="cloud"></div>
      <!-- cloud div starts and ends -->
      <div class="text-center">
        <!-- text-center div starts -->
        <br />
        <div class="row">
          <!-- row div starts -->
          <div class="col col-md-1">
            <!-- gear div starts -->
            <div id="gear" class="gear">
              <img class="icon24" src="./image/gear.svg" />
              <div class="imgContainer">
                <img class="cloud" src="image/cloud.svg" />
                <img class="cloud2" src="image/cloud2.svg" />
                <img class="cloud3" src="image/cloud3.svg" />
              </div>
            </div>
          </div>
          <!-- gear div ends -->
          <div class="col col-md-3">
            <!-- rectangle div starts -->
            <div class="rectangle">
              <div class="diamond col">
                <img class="icon24" src="./image/diamond.svg" />
              </div>
              <div id="diamond-num" class="diamond-number col">1000</div>
            </div>
          </div>
          <!-- rectangle div ends -->
          <div class="col col-md-3">
            <!-- rectangle2 div starts -->
            <div class="rectangle2">
              <div class="coin">
                <img class="icon24" src="./image/coin.svg" />
              </div>
              <div id="coin-num" class="coin-number">1000</div>
            </div>
            <div id="progress-container" class="progress-container">
              <div id="progress-bar" class="progress-bar"></div>
            </div>
          </div>
          <!-- rectangle2 div ends -->
          <div class="col col-md-3">
            <!-- new rectangle div starts -->
            <div class="rectangle3">
              <img class="timer" src="./image/timer.svg" width="45px" />
              <div id="time" class="time"></div>
            </div>
          </div>
          <!-- new rectangle div ends -->
          <div class="col col-md-2">
            <!-- power-button div starts -->
            <img class="icon24" src="./image/power-button.svg" />
          </div>
          <!-- power-button div ends -->
        </div>
        <!-- row div ends -->
      </div>
      <!-- text-center div ends -->
      <!-- Adicione o botão 'Click Here' -->
      <div class="d-grid gap-2 col-2 mx-auto">
        <button id="coinButton" class="btn btn-primary" type="button">
          Click Here
        </button>
        <!-- Adicione o botão 'Upgrade' -->
        <button id="upgradeButton" class="btn btn-secondary" type="button">
          Upgrade
        </button>
      </div>
    </div>
    <!-- Sky div ends -->

    <div class="Ground"></div>
    <!-- Ground div starts and ends -->

    <!-- Modal -->
    <div id="myModal" class="modal">
      <!-- myModal div starts -->
      <div class="modal-content">
        <span class="close">x</span>
        <!-- Elementos de volume -->
        <div class="volume-control">
          <img class="sound" src="./image/sound-icon.svg" width="40px" />
          <input
            type="range"
            min="0"
            max="100"
            value="50"
            class="slider"
            id="volumeSlider"
          />
        </div>
        <!-- Ícone de tela cheia abaixo dos elementos de volume -->
        <img class="fullscreen" src="./image/fullscreen.svg" width="40px" />
      </div>
    </div>
    <!-- myModal div ends -->

    <audio id="myAudio">
      <source
        src="./music/624644__sonically_sound__medievalrpg-music.wav"
        type="audio/wav"
      />
    </audio>

    <!-- Link to JavaScript -->
    <script src="./js/data_structure/inventory.js"></script>
    <script src="./js/data_structure/meta_data.js"></script>
    <script src="./js/data_structure/player_data.js"></script>
    <script src="./js/game.js"></script>
  </body>
</html>
